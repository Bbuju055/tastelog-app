[pytest]
testpaths = tests api/tests
filterwarnings =
    # pyiceberg deprecation warnings (transitive: supabase → storage3 → pyiceberg)
    ignore:.*enablePackrat.*deprecated.*:DeprecationWarning:pyiceberg
    ignore:.*escChar.*argument is deprecated.*:DeprecationWarning:pyiceberg
    ignore:.*unquoteResults.*argument is deprecated.*:DeprecationWarning:pyiceberg
    ignore:.*@model_validator.*mode='after'.*classmethod is deprecated.*:pydantic.warnings.PydanticDeprecatedSince212:pyiceberg
