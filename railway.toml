[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/ready"
healthcheckTimeout = 30

# numReplicas not set here — replica count is Railway dashboard-owned (expected prod: service `tastelog` = 2 same-region replicas @ us-east4-eqdc4a; rollback Replicas → 1). Expected topology + rollback recorded in docs/deploy-topology.md.
