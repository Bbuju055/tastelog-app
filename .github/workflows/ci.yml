name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    env:
      # Placeholder values (same as .env.example). Tests never reach a real Supabase or Anthropic endpoint.
      SUPABASE_URL: https://example-project.supabase.co
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUtcHJvamVjdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUifQ.placeholder-signature
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUtcHJvamVjdCIsInJvbGUiOiJhbm9uIn0.placeholder-signature
      ANTHROPIC_API_KEY: sk-ant-placeholder
      TEST_USER_ID: 00000000-0000-0000-0000-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip pip-tools
      - run: python -m piptools sync requirements-dev.txt
      # Real PDF regression fixtures exercise page counting and rasterization.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pytest -q

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tastelog-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tastelog-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tastelog-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: several UI suites (SuccessBeat, DraftReviewScreen) hang under Node 20.
          node-version: 24
          cache: npm
          cache-dependency-path: tastelog-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  db-proof:
    name: DB proof (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check image acquisition failure handling
        run: python3 tests/db/test_prepare_image.py
      # Exact image/version + architecture key; never restore a different version.
      - uses: actions/cache/restore@v4
        id: db-image
        with:
          path: ${{ runner.temp }}/db-proof-image.tar
          key: db-proof-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/db/postgres-image.txt') }}
      - name: Load cached database image
        if: steps.db-image.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/db-proof-image.tar"
      - name: Prepare database image
        run: bash tests/db/prepare_image.sh
      - name: Archive database image
        if: steps.db-image.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: docker save --output "$RUNNER_TEMP/db-proof-image.tar" "$(cat tests/db/postgres-image.txt)"
      # Save before assertions so an unrelated SQL failure doesn't force another
      # registry download. Only trusted main pushes populate the shared cache.
      - uses: actions/cache/save@v4
        if: steps.db-image.outputs.cache-hit != 'true' && github.event_name == 'push'
        with:
          path: ${{ runner.temp }}/db-proof-image.tar
          key: ${{ steps.db-image.outputs.cache-primary-key }}
      # Applies the reconstructed base schema + migrations 003..028 on the
      # production Postgres image and runs the proof batteries (needs Docker).
      - run: tests/db/run_db_proof.sh
