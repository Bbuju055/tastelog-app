name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    env:
      # Placeholder values (same as .env.example). Tests never reach a real Supabase or Anthropic endpoint.
      SUPABASE_URL: https://example-project.supabase.co
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUtcHJvamVjdCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUifQ.placeholder-signature
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUtcHJvamVjdCIsInJvbGUiOiJhbm9uIn0.placeholder-signature
      ANTHROPIC_API_KEY: sk-ant-placeholder
      TEST_USER_ID: 00000000-0000-0000-0000-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip pip-tools
      - run: python -m piptools sync requirements-dev.txt
      - run: python -m pytest -q

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tastelog-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tastelog-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tastelog-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24: several UI suites (SuccessBeat, DraftReviewScreen) hang under Node 20.
          node-version: 24
          cache: npm
          cache-dependency-path: tastelog-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  db-proof:
    name: DB proof (real PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies the reconstructed base schema + migrations 003..027 on the
      # production Postgres image and runs the proof batteries (needs Docker).
      - run: tests/db/run_db_proof.sh
